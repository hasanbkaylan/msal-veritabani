<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3a72">
<title>MSAL Kişi Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4f9; --surface:#fff; --ink:#142033; --muted:#5d6b82; --line:#e2e8f1;
  --brand:#1d3a72; --focus:#2f6bff;
  --c-ogrenci:#1b5bc4; --b-ogrenci:#e5eeff;
  --c-ogretmen:#a24a07; --b-ogretmen:#ffefd9;
  --c-mudur:#bb2530; --b-mudur:#ffe6e8;
  --c-diger:#74359f; --b-diger:#f0e7fa;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1523; --surface:#161f31; --ink:#e9eef7; --muted:#9aa8c0; --line:#24304a;
    --brand:#16264a; --focus:#7fa6ff;
    --c-ogrenci:#8db5ff; --b-ogrenci:#1b2d52;
    --c-ogretmen:#ffbe7a; --b-ogretmen:#3a2a14;
    --c-mudur:#ff9aa1; --b-mudur:#3d1b20;
    --c-diger:#d3a8ff; --b-diger:#2d1f42;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Üst bant */
.top{background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-left,0px)) 22px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px}
.top img{width:52px;height:52px;object-fit:contain;flex:none;border-radius:12px;background:rgba(255,255,255,.12);padding:4px}
.top h1{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.top p{font-size:.85rem;opacity:.78;margin-top:2px}

/* Arama + filtre (yapışkan) */
.tools{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-left,0px)) 8px}
.tools-in{max-width:820px;margin:0 auto}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:50px;padding:0 48px 0 44px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);font-size:1rem;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
.search input:focus{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 22%,transparent)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:none;place-items:center;cursor:pointer}
.clear.on{display:grid}
.clear svg{position:static;translate:none;width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 4px;margin:0 -4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip small{font-size:.76rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.count{font-size:.82rem;color:var(--muted);padding:6px 2px 0}

/* Liste */
main{max-width:820px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.group{content-visibility:auto;contain-intrinsic-size:auto 400px}
.group h2{position:sticky;top:var(--tb,150px);z-index:5;background:var(--bg);color:var(--brand);font-size:.85rem;font-weight:800;padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
@media (prefers-color-scheme:dark){.group h2{color:#9db8f5}}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:800;letter-spacing:.02em}
.who{min-width:0}
.name{font-size:1.02rem;font-weight:700;overflow-wrap:anywhere}
.role{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;margin-top:2px}
.role::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-ogrenci{color:var(--c-ogrenci)} .t-ogretmen{color:var(--c-ogretmen)} .t-mudur{color:var(--c-mudur)} .t-diger{color:var(--c-diger)}
.av.t-ogrenci{background:var(--b-ogrenci)} .av.t-ogretmen{background:var(--b-ogretmen)} .av.t-mudur{background:var(--b-mudur)} .av.t-diger{background:var(--b-diger)}

/* Boş / hata / yükleniyor */
.state{margin:28px 16px;padding:28px 20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;text-align:center}
.state h3{font-size:1.05rem;font-weight:800;margin-bottom:6px}
.state p{color:var(--muted);font-size:.92rem;max-width:42ch;margin:0 auto}
.state.err{border-color:var(--c-mudur)}
.state button{margin-top:16px;height:44px;padding:0 20px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.sk{height:64px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--muted) 14%,transparent),transparent);translate:-100% 0;animation:sh 1.3s infinite}
@keyframes sh{to{translate:100% 0}}
[hidden]{display:none!important}

@media (min-width:860px){
  main{margin-top:12px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
  .row:hover{background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img src="msal.png" alt="MSAL logosu" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 52 52%22%3E%3Ctext x=%2226%22 y=%2233%22 font-family=%22sans-serif%22 font-size=%2215%22 font-weight=%22800%22 fill=%22white%22 text-anchor=%22middle%22%3EMSAL%3C/text%3E%3C/svg%3E'">
    <div>
      <h1>Mehmet Serttaş Anadolu Lisesi</h1>
      <p>Öğrenci, öğretmen ve personel rehberi</p>
    </div>
  </div>
</header>

<div class="tools" id="tools">
  <div class="tools-in">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Ad veya soyad ara" aria-label="Kişi ara">
      <button class="clear" id="clear" type="button" aria-label="Aramayı temizle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Role göre filtrele"></div>
    <div class="count" id="count" aria-live="polite">Yükleniyor…</div>
  </div>
</div>

<main id="list">
  <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
</main>

<script>
let data = [], role = "";
const $ = id => document.getElementById(id);
const q = $("q"), list = $("list"), chips = $("chips"), count = $("count"), clear = $("clear");

const tr = s => s.toLocaleLowerCase("tr-TR");
const norm = s => tr(s).replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function tone(r){
  const k = tr(r);
  if (k.includes("öğrenci")) return "ogrenci";
  if (k.includes("öğretmen")) return "ogretmen";
  if (k.includes("müdür")) return "mudur";
  return "diger";
}
const up = s => (s || "").charAt(0).toLocaleUpperCase("tr-TR");

function load(){
  list.innerHTML = '<div class="sk"></div>'.repeat(6);
  count.textContent = "Yükleniyor…";
  fetch("veritabani.json")
    .then(r => { if (!r.ok) throw new Error("okunamadı"); return r.json(); })
    .then(d => {
      data = d.map(k => ({...k, key: norm(k.ad + " " + k.soyad)}))
              .sort((a,b) => a.ad.localeCompare(b.ad,"tr-TR") || a.soyad.localeCompare(b.soyad,"tr-TR"));
      render();
    })
    .catch(e => {
      console.error(e);
      count.textContent = "Veriler yüklenemedi";
      list.innerHTML = '<div class="state err"><h3>Veriler yüklenemedi</h3><p>veritabani.json dosyası okunamadı. Dosyayı yerel olarak açtıysan tarayıcı bunu engelliyor olabilir; siteyi bir web sunucusunda (ör. VS Code Live Server) aç.</p><button type="button" id="retry">Tekrar dene</button></div>';
      $("retry").onclick = load;
    });
}

function render(){
  const terms = norm(q.value.trim()).split(/\s+/).filter(Boolean);
  const bySearch = data.filter(k => terms.every(t => k.key.includes(t)));
  const shown = role ? bySearch.filter(k => k.rol === role) : bySearch;

  // Rol çipleri (sayılar aramaya göre güncellenir)
  const counts = {};
  bySearch.forEach(k => counts[k.rol] = (counts[k.rol] || 0) + 1);
  const roles = [...new Set(data.map(k => k.rol))].sort((a,b) => a.localeCompare(b,"tr-TR"));
  chips.innerHTML = [["", "Tümü", bySearch.length], ...roles.map(r => [r, r, counts[r] || 0])]
    .map(([v,l,n]) => `<button type="button" class="chip" data-r="${esc(v)}" aria-pressed="${v === role}">${esc(l)} <small>${n}</small></button>`).join("");

  count.textContent = shown.length ? `${shown.length} kişi listeleniyor` : "Sonuç yok";

  if (!shown.length){
    list.innerHTML = '<div class="state"><h3>Eşleşen kişi bulunamadı</h3><p>Yazımı kontrol et veya rol filtresini “Tümü” yap.</p></div>';
    return;
  }
  let html = "", cur = "";
  shown.forEach(k => {
    const L = up(k.ad);
    if (L !== cur){ if (cur) html += "</section>"; html += `<section class="group"><h2>${esc(L)}</h2>`; cur = L; }
    const t = tone(k.rol);
    html += `<div class="row"><div class="av t-${t}" aria-hidden="true">${esc(up(k.ad) + up(k.soyad))}</div><div class="who"><div class="name">${esc(k.ad)} ${esc(k.soyad)}</div><div class="role t-${t}">${esc(k.rol)}</div></div></div>`;
  });
  list.innerHTML = html + "</section>";
}

chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  role = b.dataset.r; render();
  chips.querySelector('[aria-pressed="true"]')?.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  scrollTo({top: Math.min(scrollY, $("tools").offsetTop), behavior:"instant"});
});
let timer;
q.addEventListener("input", () => {
  clear.classList.toggle("on", q.value !== "");
  clearTimeout(timer); timer = setTimeout(render, 80);
});
clear.addEventListener("click", () => { q.value = ""; clear.classList.remove("on"); render(); q.focus(); });

// Harf başlıklarının yapışkan konumu = arama çubuğunun yüksekliği
new ResizeObserver(() => document.documentElement.style.setProperty("--tb", $("tools").offsetHeight + "px")).observe($("tools"));

load();
</script>
</body>
</html>
